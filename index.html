<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sumit Gupta — Developer and creator of sAkshi.">
  <title>Sumit Gupta | Building sAkshI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection,
    *::selection {
      background: #71ebba;
      color: #03130e;
      text-shadow: none;
    }

    ::-moz-selection,
    *::-moz-selection {
      background: #71ebba;
      color: #03130e;
      text-shadow: none;
    }

    html {
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      padding: 32px 6%;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: page-load-fade-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes page-load-fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    [hidden] {
      display: none !important;
    }

    a:focus-visible {
      outline: 2px solid #71ebba;
      outline-offset: 6px;
    }

    /* Navigation */
    .navbar {
      max-width: 1400px;
      margin: 0 auto 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      flex-shrink: 0;
      color: #fff;
      text-decoration: none;
      font-size: clamp(25px, 2.2vw, 30px);
      font-weight: 750;
      letter-spacing: -1.1px;
      line-height: 1.1;
      cursor: pointer;
    }

    .logo-accent {
      color: #8b7cff;
    }

    /* Social icon links */
    .social-links {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-left: auto;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: #a5a5a5;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-links svg {
      display: block;
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .social-links a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    /* Vanta panel: original blue-violet fog stays unchanged */
    .vanta-panel {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: min(72vh, 720px);
      min-height: 430px;
      overflow: hidden;
      border: 1px solid rgba(139, 124, 255, 0.48);
      border-radius: 24px;
      background: #050816;
      box-shadow: 0 0 45px rgba(80, 65, 190, 0.08);
    }

    #vanta-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #vanta-background canvas {
      position: absolute !important;
      inset: 0;
    }

    /* Transparent Three.js scene layered over the existing nebula on the right */
    .sakshi-3d-scene {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 45%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: 1;
    }

    .sakshi-3d-scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .vanta-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.3),
        rgba(0, 0, 0, 0.02)
      );
    }

    /* Hero text */
    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      padding: clamp(28px, 8vw, 110px);
      pointer-events: none;
    }

    .hero-title {
      color: #fff;
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 600;
      letter-spacing: -5px;
      line-height: 1.08;
    }

    .sakshi-line {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      letter-spacing: -1px;
    }

    /* Canvas-only dots overlay; the real text remains the sizing/accessibility placeholder. */
    #sakshi-dots {
      display: none;
      position: absolute;
      left: -70px;
      top: 50%;
      width: calc(100% + 140px);
      height: calc(100% + 140px);
      transform: translateY(-50%);
      z-index: 1;
      overflow: visible;
      pointer-events: none;
      filter:
        drop-shadow(0 0 6px rgba(113, 235, 186, 0.7))
        drop-shadow(0 0 18px rgba(22, 185, 131, 0.35));
    }

    .sakshi-line.dots-active #sakshi-dots {
      display: block;
      animation: sakshi-dots-glow 1.8s ease-in-out infinite alternate;
    }

    /* Hide the real word on the very first paint while the dot canvas initializes. */
    .sakshi-line.dots-pending #sakshi-text,
    .sakshi-line.dots-active #sakshi-text {
      visibility: hidden;
    }

    .sakshi-line.dots-active .typing-cursor {
      position: absolute;
      left: 0;
      top: 50%;
      z-index: 2;
      margin-left: 0;
      transform: translateY(-35%);
    }

    /* Moving green gradient + glow, revealed by the typewriter script */
    .sakshi-text {
      display: inline-block;
      color: #71ebba;
      background-image: linear-gradient(
        110deg,
        #71ebba 0%,
        #16b983 22%,
        #e4fff3 38%,
        #065540 53%,
        #16b983 68%,
        #71ebba 84%,
        #e4fff3 100%
      );
      background-size: 240% 100%;
      background-position: 0% 50%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation:
        sakshi-gradient 3.2s linear infinite,
        sakshi-glow 1.8s ease-in-out infinite alternate;
    }

    .typing-cursor {
      /* Hide the blinking typewriter caret; keep its element for script compatibility. */
      display: none !important;
      width: 3px;
      height: 0.82em;
      margin-left: 0.08em;
      vertical-align: baseline;
      background: #71ebba;
      border-radius: 2px;
      transform: translateY(0.04em);
      box-shadow: 0 0 8px rgba(113, 235, 186, 0.85);
      animation: cursor-blink 0.85s steps(2, start) infinite;
    }

    @keyframes sakshi-gradient {
      from { background-position: 0% 50%; }
      to { background-position: 240% 50%; }
    }

    @keyframes sakshi-glow {
      from {
        filter: drop-shadow(0 0 3px rgba(113, 235, 186, 0.45));
      }
      to {
        filter:
          drop-shadow(0 0 7px rgba(113, 235, 186, 0.9))
          drop-shadow(0 0 20px rgba(22, 185, 131, 0.38));
      }
    }

    @keyframes cursor-blink {
      to { opacity: 0; }
    }

    @keyframes sakshi-dots-glow {
      from {
        filter:
          drop-shadow(0 0 4px rgba(113, 235, 186, 0.48))
          drop-shadow(0 0 13px rgba(22, 185, 131, 0.25));
      }
      to {
        filter:
          drop-shadow(0 0 7px rgba(113, 235, 186, 0.78))
          drop-shadow(0 0 20px rgba(22, 185, 131, 0.4));
      }
    }

    /* Forbidden page */
    .forbidden-page {
      max-width: 1400px;
      min-height: 65vh;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .forbidden-content {
      max-width: 650px;
    }

    .error-code {
      display: block;
      margin-bottom: 18px;
      color: #8b7cff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 5px;
    }

    .forbidden-title {
      color: #fff;
      font-size: clamp(42px, 7vw, 76px);
      letter-spacing: -3px;
    }

    .forbidden-title span {
      color: #8b7cff;
    }

    .forbidden-content p {
      margin-top: 22px;
      color: #9292a5;
      font-size: 15px;
      line-height: 1.8;
    }

    .home-link {
      display: inline-block;
      margin-top: 32px;
      padding: 13px 22px;
      border: 1px solid rgba(139, 124, 255, 0.5);
      border-radius: 8px;
      color: #bdb5ff;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .home-link:hover {
      background: rgba(139, 124, 255, 0.1);
      border-color: #8b7cff;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 5%;
      }

      .navbar {
        margin-bottom: 32px;
        gap: 16px;
      }

      .logo {
        font-size: 25px;
      }

      .social-links {
        gap: 16px;
      }

      .social-links a {
        width: 25px;
        height: 25px;
      }

      .social-links svg {
        width: 20px;
        height: 20px;
      }

      .vanta-panel {
        min-height: 500px;
        height: 70vh;
        border-radius: 18px;
      }

      .sakshi-3d-scene {
        left: 0;
        opacity: 0.6;
      }

      .hero-title {
        letter-spacing: -2.5px;
      }

      .forbidden-title {
        letter-spacing: -2px;
      }
    }

    @media (max-width: 360px) {
      .navbar {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .social-links {
        margin-left: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .sakshi-text,
      .typing-cursor,
      #sakshi-dots,
      .social-links a,
      .home-link {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main id="home-page">
    <section class="vanta-panel" aria-label="Building sAkshi">
      <div id="vanta-background" aria-hidden="true"></div>
      <div id="sakshi-3d-scene" class="sakshi-3d-scene" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>

  <script>
    let vantaEffect;

    const path = window.location.pathname.replace(/\/+$/, "") || "/";
    const isLocalFile = window.location.protocol === "file:";
    const isHome = isLocalFile || path === "/" || path === "/index.html";

    const homePage = document.getElementById("home-page");
    const forbiddenPage = document.getElementById("forbidden-page");

    if (isHome) {
      homePage.hidden = false;
      forbiddenPage.hidden = true;

      /* Dot-matrix sAkshi text. If canvas sampling fails, use the original text typewriter. */
      (() => {
        const sakshiText = document.getElementById("sakshi-text");
        const sakshiLine = document.querySelector(".sakshi-line");
        const dotCanvas = document.getElementById("sakshi-dots");
        const typingCursor = document.querySelector(".typing-cursor");
        const fullText = "sAkshI";
        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

        /* Tweak variables */
        const BASE_DOT_STEP_DESKTOP = 4;
        const BASE_DOT_STEP_MOBILE = 5;
        const DESKTOP_DOT_CAP = 2500;
        const MOBILE_DOT_CAP = 1200;
        const DOT_RADIUS_FACTOR = 0.42;
        const CANVAS_PADDING = 70;
        const REPEL_RADIUS_SCALE = 0.9;
        const REPEL_RADIUS_MIN = 70;
        const REPEL_RADIUS_MAX = 130;
        const REPEL_STRENGTH = 0.6;
        const SPRING_K = 0.08;
        const DAMPING = 0.82;
        const SPAWN_DELAY_MS = 450;
        const LETTER_INTERVAL_MS = 170;
        const SPAWN_DURATION_MS = 500;
        const SHIMMER_SPEED = 0.22;
        const COLOR_BUCKET_COUNT = 12;
        const COLOR_STOPS = [
          [22, 185, 131],
          [113, 235, 186],
          [228, 255, 243],
          [113, 235, 186],
          [22, 185, 131]
        ];

        let dotContext = null;
        let maskCanvas = null;
        let maskContext = null;
        let active = false;
        let disposed = false;
        let reducedMotion = motionQuery.matches;
        let heroIsVisible = !("IntersectionObserver" in window);
        let tabIsVisible = document.visibilityState === "visible";
        let animationFrameId = 0;
        let resizeTimer = 0;
        let resizeObserver = null;
        let intersectionObserver = null;
        let animationElapsedMs = 0;
        let lastFrameTime = 0;
        let lastPointerTime = 0;
        let canvasCssWidth = 0;
        let canvasCssHeight = 0;
        let canvasDpr = 1;
        let textWidth = 0;
        let fontSizePx = 100;
        let baseDotRadius = 1.7;
        let repelRadius = 90;
        let revealCount = 0;
        let pointerActive = false;
        let touchActive = false;
        let pointerX = -10000;
        let pointerY = -10000;
        let letterBounds = [];
        let letterRightOffsets = new Float32Array(0);
        let letterSpawnTimes = new Float32Array(fullText.length);
        let letterHasSpawned = new Uint8Array(fullText.length);
        let homeX = new Float32Array(0);
        let homeY = new Float32Array(0);
        let dotX = new Float32Array(0);
        let dotY = new Float32Array(0);
        let dotVX = new Float32Array(0);
        let dotVY = new Float32Array(0);
        let dotLetterIndex = new Float32Array(0);
        let dotBaseBucket = new Uint8Array(0);
        let dotNearCursor = new Float32Array(0);
        let bucketGroups = [];
        let dotCount = 0;
        let currentDotStep = BASE_DOT_STEP_DESKTOP;
        let fallbackTimers = [];
        let palette = [];
        let onMotionChange;

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function smoothstep01(value) {
          const t = clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function rgbToCss(rgb) {
          return `rgb(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])})`;
        }

        function makePalette() {
          const colors = [];
          for (let i = 0; i < COLOR_BUCKET_COUNT; i++) {
            const position = i / (COLOR_BUCKET_COUNT - 1);
            const segmentPosition = position * (COLOR_STOPS.length - 1);
            const segment = Math.min(COLOR_STOPS.length - 2, Math.floor(segmentPosition));
            const fraction = segmentPosition - segment;
            const a = COLOR_STOPS[segment];
            const b = COLOR_STOPS[segment + 1];
            colors.push(rgbToCss([
              a[0] + (b[0] - a[0]) * fraction,
              a[1] + (b[1] - a[1]) * fraction,
              a[2] + (b[2] - a[2]) * fraction
            ]));
          }
          return colors;
        }

        function getRevealCount(elapsedMs) {
          if (reducedMotion) return fullText.length;
          if (elapsedMs < SPAWN_DELAY_MS) return 0;
          return Math.min(
            fullText.length,
            Math.floor((elapsedMs - SPAWN_DELAY_MS) / LETTER_INTERVAL_MS) + 1
          );
        }

        function clearFallbackTimers() {
          fallbackTimers.forEach((timer) => window.clearTimeout(timer));
          fallbackTimers = [];
        }

        function startFallbackTypewriter() {
          active = false;
          sakshiLine.classList.remove("dots-active", "dots-pending");
          dotCanvas.style.display = "none";
          clearFallbackTimers();
          sakshiText.textContent = "";
          typingCursor.style.left = "";
          typingCursor.style.position = "";

          if (motionQuery.matches) {
            sakshiText.textContent = fullText;
            return;
          }

          let index = 0;
          const typeNextCharacter = () => {
            if (disposed || active || motionQuery.matches) return;
            if (index < fullText.length) {
              sakshiText.textContent += fullText.charAt(index);
              index += 1;
              fallbackTimers.push(window.setTimeout(typeNextCharacter, LETTER_INTERVAL_MS));
            }
          };
          fallbackTimers.push(window.setTimeout(typeNextCharacter, SPAWN_DELAY_MS));
        }

        function getCharacterBounds(spanRect, textNode) {
          const result = [];
          const range = document.createRange();
          for (let i = 0; i < fullText.length; i++) {
            range.setStart(textNode, i);
            range.setEnd(textNode, i + 1);
            const rect = range.getBoundingClientRect();
            result.push({
              left: rect.left - spanRect.left,
              right: rect.right - spanRect.left,
              center: (rect.left + rect.right) / 2 - spanRect.left
            });
          }
          range.detach?.();
          return result;
        }

        function drawMask(spanRect, style, textNode) {
          const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
          const width = Math.max(1, Math.ceil(spanRect.width));
          const height = Math.max(1, Math.ceil(spanRect.height));

          maskCanvas.width = Math.max(1, Math.ceil(width * dpr));
          maskCanvas.height = Math.max(1, Math.ceil(height * dpr));
          maskContext.setTransform(dpr, 0, 0, dpr, 0, 0);
          maskContext.clearRect(0, 0, width, height);
          maskContext.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          maskContext.textBaseline = "alphabetic";
          maskContext.fillStyle = "#ffffff";

          const metrics = maskContext.measureText(fullText);
          const ascent = metrics.actualBoundingBoxAscent || fontSizePx * 0.78;
          const descent = metrics.actualBoundingBoxDescent || fontSizePx * 0.22;
          const baseline = Math.max(
            ascent,
            (height - ascent - descent) / 2 + ascent
          );

          const supportsLetterSpacing = "letterSpacing" in maskContext;
          if (supportsLetterSpacing) {
            try {
              maskContext.letterSpacing = style.letterSpacing;
              maskContext.fillText(fullText, 0, baseline);
            } catch (error) {
              for (let i = 0; i < fullText.length; i++) {
                maskContext.fillText(fullText.charAt(i), letterBounds[i].left, baseline);
              }
            }
          } else {
            /* Range-derived character starts preserve the browser's letter spacing. */
            for (let i = 0; i < fullText.length; i++) {
              maskContext.fillText(fullText.charAt(i), letterBounds[i].left, baseline);
            }
          }

          return {
            image: maskContext.getImageData(0, 0, maskCanvas.width, maskCanvas.height),
            dpr,
            width,
            height
          };
        }

        function collectDots(maskInfo, step, maxDots, paddingX, paddingY) {
          const outputX = [];
          const outputY = [];
          const outputLetters = [];
          const data = maskInfo.image.data;
          const pixelWidth = maskCanvas.width;
          const dpr = maskInfo.dpr;

          for (let y = step * 0.5; y < maskInfo.height; y += step) {
            const pixelY = clamp(Math.round(y * dpr), 0, maskCanvas.height - 1);
            for (let x = step * 0.5; x < maskInfo.width; x += step) {
              const pixelX = clamp(Math.round(x * dpr), 0, pixelWidth - 1);
              const alphaIndex = (pixelY * pixelWidth + pixelX) * 4 + 3;
              if (data[alphaIndex] < 70) continue;

              let letterIndex = -1;
              for (let i = 0; i < letterBounds.length; i++) {
                if (x >= letterBounds[i].left - 1 && x <= letterBounds[i].right + 1) {
                  letterIndex = i;
                  break;
                }
              }
              if (letterIndex < 0) {
                let nearestDistance = Infinity;
                for (let i = 0; i < letterBounds.length; i++) {

              vViewPosition = -mvPosition.xyz;
              vLocalPosition = position;
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            uniform float uTime;
            uniform float uGlow;
            uniform float uVisibility;
            uniform vec2 uCursorLocal;
            uniform float uCursorStrength;
            uniform vec3 uGlowColor;
            uniform float uReducedMotion;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vLocalPosition;

            void main() {
              vec3 normal = normalize(vNormal);
              vec3 viewDirection = normalize(vViewPosition);
              float fresnel = pow(1.0 - max(dot(normal, viewDirection), 0.0), 2.4);

              float envGradient = smoothstep(-0.9, 0.85, normal.y + normal.x * 0.22);
              vec3 envTop = vec3(0.035, 0.105, 0.095);
              vec3 envBottom = vec3(0.006, 0.014, 0.026);
              vec3 baseColor = mix(envBottom, envTop, envGradient);

              float pulse = mix(1.0, 0.88 + 0.12 * sin(uTime * 1.25), 1.0 - uReducedMotion);
              float cursorBloom = exp(-length(vLocalPosition.xy - uCursorLocal) * 1.65) * uCursorStrength;
              float edgeStrength = fresnel * (0.22 + 0.8 * uGlow + cursorBloom * 1.7);
              float innerWave = 0.5 + 0.5 * sin(vLocalPosition.x * 5.0 + vLocalPosition.y * 4.0 + uTime * 0.75);
              vec3 greenEdge = uGlowColor * edgeStrength;
              vec3 internalGlow = uGlowColor * 0.28 * uGlow * (0.22 + innerWave * 0.25) * pulse;
              vec3 color = baseColor + greenEdge + internalGlow;

              gl_FragColor = vec4(color, (0.84 + min(fresnel * 0.15, 0.15)) * uVisibility);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        crystal = new THREE.Mesh(crystalGeometry, crystalMaterial);
        crystal.rotation.set(0.12, -0.18, 0.04);
        rootGroup.add(crystal);

        const innerGeometry = new THREE.IcosahedronGeometry(0.62, 1);
        innerGlowMaterial = new THREE.MeshBasicMaterial({
          color: GLOW_COLOR,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        innerGlow = new THREE.Mesh(innerGeometry, innerGlowMaterial);
        rootGroup.add(innerGlow);

        coreLight = new THREE.PointLight(GLOW_COLOR, 0, 3.4, 2);
        coreLight.position.set(0, 0, 0.15);
        rootGroup.add(coreLight);
      }

      function buildShellGeometry(count) {
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          const z = Math.random() * 2 - 1;
          const angle = Math.random() * Math.PI * 2;
          const planarRadius = Math.sqrt(1 - z * z);
          const radius = 1.52 + Math.random() * 0.57;
          const index = i * 3;

          positions[index] = planarRadius * Math.cos(angle) * radius;
          positions[index + 1] = planarRadius * Math.sin(angle) * radius;
          positions[index + 2] = z * radius;

          const color = Math.random() < 0.7 ? glowColor : purpleColor;
          colors[index] = color.r;
          colors[index + 1] = color.g;
          colors[index + 2] = color.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
        shellBasePositions = new Float32Array(positions);
        repelX = new Float32Array(count);
        repelY = new Float32Array(count);
        repelZ = new Float32Array(count);
        return geometry;
      }

      function createParticleShell() {
        particleCount = isMobile ? MOBILE_PARTICLE_COUNT : DESKTOP_PARTICLE_COUNT;
        shellGeometry = buildShellGeometry(particleCount);
        shellMaterial = new THREE.PointsMaterial({
          size: isMobile ? 0.023 : 0.019,
          vertexColors: true,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          sizeAttenuation: true
        });
        shell = new THREE.Points(shellGeometry, shellMaterial);
        rootGroup.add(shell);
      }

      function rebuildParticleShell() {
        if (!shell || !shellMaterial) return;
        const nextCount = isMobile ? MOBILE_PARTICLE_COUNT : DESKTOP_PARTICLE_COUNT;
        if (nextCount === particleCount) return;

        const newGeometry = buildShellGeometry(nextCount);
        shell.geometry.dispose();
        shell.geometry = newGeometry;
        shellGeometry = newGeometry;
        particleCount = nextCount;
        shellMaterial.size = isMobile ? 0.023 : 0.019;
      }

      function createRings() {
        const ringGeometry = new THREE.TorusGeometry(1, 0.0045, 6, 180);
        const orbitDotGeometry = new THREE.SphereGeometry(0.032, 8, 8);

        ringDefinitions.forEach((definition, ringIndex) => {
          const ringGroup = new THREE.Group();
          ringGroup.rotation.set(definition.tiltX, definition.tiltY, 0);
          ringGroup.userData.speed = definition.speed;
          ringGroup.userData.radius = definition.radius;
          ringGroup.userData.baseOpacity = definition.opacity;

          const ringMaterial = new THREE.MeshBasicMaterial({
            color: definition.color,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
          ringMesh.scale.setScalar(definition.radius);
          ringGroup.add(ringMesh);

          const dotMaterial = new THREE.MeshBasicMaterial({
            color: definition.color,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });

          for (let dotIndex = 0; dotIndex < 2; dotIndex++) {
            const dot = new THREE.Mesh(orbitDotGeometry, dotMaterial);
            const phase = dotIndex * Math.PI + ringIndex * 0.7;
            dot.userData.phase = phase;
            dot.userData.radius = definition.radius;
            dot.userData.speed = definition.speed * (dotIndex === 0 ? 1 : -0.82);
            dot.position.set(
              Math.cos(phase) * definition.radius,
              Math.sin(phase) * definition.radius,
              0
            );
            ringGroup.add(dot);
            ringParticles.push({ mesh: dot, material: dotMaterial });
          }

          ringGroups.push(ringGroup);
          rootGroup.add(ringGroup);
        });
      }

      function resizeScene() {
        if (!renderer || !camera || disposed) return;
        const bounds = sceneHost.getBoundingClientRect();
        const width = Math.max(1, bounds.width);
        const height = Math.max(1, bounds.height);

        renderer.setPixelRatio(Math.min(2, Math.max(1, window.devicePixelRatio || 1)));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        const nextMobile = window.innerWidth < 768;
        if (nextMobile !== isMobile) {
          isMobile = nextMobile;
          rebuildParticleShell();
        }

        rootGroup.scale.setScalar(isMobile ? 0.72 : 0.98);
        rootGroup.position.y = isMobile ? -0.72 : 0;
      }

      function handlePointerMove(event) {
        const panelBounds = heroPanel.getBoundingClientRect();
        const panelX = (event.clientX - panelBounds.left) / Math.max(panelBounds.width, 1);
        const panelY = (event.clientY - panelBounds.top) / Math.max(panelBounds.height, 1);
        targetRotation.x = reducedMotion ? 0 : THREE.MathUtils.clamp((panelY - 0.5) * 2, -1, 1) * maxTilt;
        targetRotation.y = reducedMotion ? 0 : THREE.MathUtils.clamp((panelX - 0.5) * 2, -1, 1) * maxTilt;

        const sceneBounds = sceneHost.getBoundingClientRect();
        pointerInScene =
          event.clientX >= sceneBounds.left && event.clientX <= sceneBounds.right &&
          event.clientY >= sceneBounds.top && event.clientY <= sceneBounds.bottom;

        if (pointerInScene) {
          pointerNdc.x = ((event.clientX - sceneBounds.left) / Math.max(sceneBounds.width, 1)) * 2 - 1;
          pointerNdc.y = -((event.clientY - sceneBounds.top) / Math.max(sceneBounds.height, 1)) * 2 + 1;
          pointerRaycaster.setFromCamera(pointerNdc, camera);
          pointerRaycaster.ray.intersectPlane(scenePlane, pointerWorld);
        }
      }

      function handlePointerLeave() {
        pointerInScene = false;
        targetRotation.set(0, 0);
      }

      function handleVisibilityChange() {
        tabIsVisible = document.visibilityState === "visible";
        syncRenderLoop();
      }

      function handleMotionPreferenceChange(event) {
        reducedMotion = event.matches;
        if (crystalMaterial) {
          crystalMaterial.uniforms.uReducedMotion.value = reducedMotion ? 1 : 0;
        }
        targetRotation.set(0, 0);
      }

      function addSceneListeners() {
        window.addEventListener("resize", resizeScene, { passive: true });
        heroPanel.addEventListener("pointermove", handlePointerMove, { passive: true });
        heroPanel.addEventListener("pointerleave", handlePointerLeave, { passive: true });
        document.addEventListener("visibilitychange", handleVisibilityChange);

        if (reducedMotionQuery.addEventListener) {
          reducedMotionQuery.addEventListener("change", handleMotionPreferenceChange);
        } else if (reducedMotionQuery.addListener) {
          reducedMotionQuery.addListener(handleMotionPreferenceChange);
        }

        if ("IntersectionObserver" in window) {
          observer = new IntersectionObserver((entries) => {
            heroIsVisible = entries.some((entry) => entry.isIntersecting);
            syncRenderLoop();
          }, { threshold: 0.05 });
          observer.observe(heroPanel);
        }
      }

      let observer = null;

      function syncRenderLoop() {
        if (disposed || !renderer) return;
        const shouldRun = heroIsVisible && tabIsVisible;
        if (shouldRun && animationFrameId === 0) {
          lastFrameTime = performance.now();
          animationFrameId = requestAnimationFrame(renderFrame);
        } else if (!shouldRun && animationFrameId !== 0) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = 0;
        }
      }

      function updateShell(progressValue, deltaTime) {
        const contraction = smoothstep(0.33, 0.83, progressValue);
        const spread = reducedMotion ? 1 : THREE.MathUtils.lerp(1.72, 1.0, contraction);
        const positions = shellGeometry.attributes.position.array;
        const cursorShellLocal = pointerLocal.clone().applyQuaternion(shell.quaternion.clone().invert());
        const repulsionEnabled = pointerInScene && !reducedMotion;
        const radiusOfInfluence = 0.86;
        const repulsionStrength = 0.15;
        const easing = Math.min(1, deltaTime * 8.0);

        for (let i = 0; i < particleCount; i++) {
          const index = i * 3;
          const bx = shellBasePositions[index] * spread;
          const by = shellBasePositions[index + 1] * spread;
          const bz = shellBasePositions[index + 2] * spread;
          const dx = bx - cursorShellLocal.x;
          const dy = by - cursorShellLocal.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          let targetX = 0;
          let targetY = 0;
          let targetZ = 0;

          if (repulsionEnabled && distance < radiusOfInfluence) {
            const ratio = 1 - distance / radiusOfInfluence;
            const force = ratio * ratio * repulsionStrength;
            const safeDistance = Math.max(distance, 0.001);
            targetX = (dx / safeDistance) * force;
            targetY = (dy / safeDistance) * force;
            targetZ = (shellBasePositions[index + 2] / Math.max(Math.abs(shellBasePositions[index + 2]), 0.35)) * force * 0.25;
          }

          repelX[i] += (targetX - repelX[i]) * easing;
          repelY[i] += (targetY - repelY[i]) * easing;
          repelZ[i] += (targetZ - repelZ[i]) * easing;

          positions[index] = bx + repelX[i];
          positions[index + 1] = by + repelY[i];
          positions[index + 2] = bz + repelZ[i];
        }

        shellGeometry.attributes.position.needsUpdate = true;
        shellMaterial.opacity = reducedMotion ? progressValue : smoothstep(0.33, 0.83, progressValue);
      }

      function renderFrame(now) {
        animationFrameId = 0;
        if (disposed || !renderer || !heroIsVisible || !tabIsVisible) return;

        const deltaTime = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        elapsed += deltaTime;
        progress = THREE.MathUtils.clamp(elapsed / (reducedMotion ? 0.8 : 3.0), 0, 1);

        const glowRamp = reducedMotion ? progress : smoothstep(0.17, 0.5, progress);
        let flicker = 1;
        if (!reducedMotion) {
          const flickerDistance = Math.abs(progress - 0.4);
          const flickerShape = THREE.MathUtils.clamp(1 - flickerDistance / 0.02, 0, 1);
          flicker = 1 - 0.6 * flickerShape;
        }

        const pulse = reducedMotion ? 1 : 0.91 + 0.09 * Math.sin(elapsed * 1.25);
        const crystalGlow = glowRamp * flicker * pulse;
        crystalMaterial.uniforms.uTime.value = elapsed;
        crystalMaterial.uniforms.uGlow.value = crystalGlow;
        crystalMaterial.uniforms.uVisibility.value = reducedMotion
          ? progress
          : smoothstep(0.08, 0.3, progress);
        innerGlowMaterial.opacity = glowRamp * flicker * (reducedMotion ? 0.13 : 0.24);
        const innerPulse = reducedMotion ? 1 : 0.96 + 0.05 * Math.sin(elapsed * 1.1);
        innerGlow.scale.setScalar(innerPulse);
        coreLight.intensity = glowRamp * flicker * (isMobile ? 0.75 : 1.2);

        if (!reducedMotion) {
          const ramp = smoothstep(0.5, 1.0, progress);
          rootGroup.rotation.x += (targetRotation.x - rootGroup.rotation.x) * 0.05;
          rootGroup.rotation.y += (targetRotation.y - rootGroup.rotation.y) * 0.05;
          crystal.rotation.y += deltaTime * 0.11 * (isMobile ? 0.55 : 1);
          crystal.rotation.x += deltaTime * 0.035 * (isMobile ? 0.55 : 1);
          shell.rotation.y += deltaTime * (isMobile ? 0.025 : 0.045);

          ringGroups.forEach((ringGroup) => {
            ringGroup.rotation.z += deltaTime * ringGroup.userData.speed * ramp * (isMobile ? 0.55 : 1);
            ringGroup.children[0].material.opacity = ringGroup.userData.baseOpacity * smoothstep(0.5, 1.0, progress);
          });

          ringParticles.forEach(({ mesh, material }) => {
            const angle = mesh.userData.phase + elapsed * mesh.userData.speed * ramp;
            mesh.position.set(
              Math.cos(angle) * mesh.userData.radius,
              Math.sin(angle) * mesh.userData.radius,
              0
            );
            material.opacity = 0.9 * ramp;
          });
        } else {
          rootGroup.rotation.x += (0 - rootGroup.rotation.x) * 0.05;
          rootGroup.rotation.y += (0 - rootGroup.rotation.y) * 0.05;
          ringGroups.forEach((ringGroup) => {
            ringGroup.children[0].material.opacity = ringGroup.userData.baseOpacity * progress;
          });
          ringParticles.forEach(({ material }) => {
            material.opacity = 0.65 * progress;
          });
        }

        updateShell(progress, deltaTime);

        rootGroup.updateMatrixWorld(true);
        if (pointerInScene) {
          pointerLocal.copy(pointerWorld);
          rootGroup.worldToLocal(pointerLocal);
          const crystalLocalCursor = pointerLocal.clone().applyQuaternion(crystal.quaternion.clone().invert());
          crystalMaterial.uniforms.uCursorLocal.value.set(crystalLocalCursor.x, crystalLocalCursor.y);
          crystalMaterial.uniforms.uCursorStrength.value = isMobile ? 0.45 : 0.9;
          cursorLight.position.copy(pointerWorld);
          cursorLight.position.z = 1.2;
          cursorLight.intensity = isMobile || reducedMotion ? 0 : 1.05;
          cursorGlowSprite.position.set(pointerWorld.x, pointerWorld.y, 1.45);
          cursorGlowMaterial.uniforms.uIntensity.value = isMobile || reducedMotion ? 0 : 1;
        } else {
          crystalMaterial.uniforms.uCursorLocal.value.set(100, 100);
          crystalMaterial.uniforms.uCursorStrength.value = 0;
          cursorLight.intensity = 0;
          cursorGlowMaterial.uniforms.uIntensity.value = 0;
          pointerLocal.set(100, 100, 100);
        }

        if (reducedMotion) {
          cursorLight.intensity = 0;
          cursorGlowMaterial.uniforms.uIntensity.value = 0;
          crystalMaterial.uniforms.uCursorStrength.value = 0;
        }

        renderer.render(scene, camera);
        if (heroIsVisible && tabIsVisible && !disposed) {
          animationFrameId = requestAnimationFrame(renderFrame);
        }
      }

      function disposeScene() {
        if (disposed) return;
        disposed = true;

        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = 0;
        }

        if (observer) {
          observer.disconnect();
          observer = null;
        }

        window.removeEventListener("resize", resizeScene);
        heroPanel.removeEventListener("pointermove", handlePointerMove);
        heroPanel.removeEventListener("pointerleave", handlePointerLeave);
        document.removeEventListener("visibilitychange", handleVisibilityChange);

        if (reducedMotionQuery.removeEventListener) {
          reducedMotionQuery.removeEventListener("change", handleMotionPreferenceChange);
        } else if (reducedMotionQuery.removeListener) {
          reducedMotionQuery.removeListener(handleMotionPreferenceChange);
        }

        if (scene) {
          scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) {
              const materials = Array.isArray(object.material) ? object.material : [object.material];
              materials.forEach((material) => material.dispose());
            }
          });
        }

        if (renderer) {
          renderer.dispose();
          renderer.forceContextLoss();
          if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      initScene();
      window.addEventListener("beforeunload", disposeScene, { once: true });
      window.addEventListener("pagehide", disposeScene, { once: true });
    }
  </script>
</body>
</html>
